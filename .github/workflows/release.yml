# Gera o PruPru.exe a partir do codigo e cria a release como rascunho.
# Uso: aba Actions > "Gerar release do PruPru" > Run workflow.
# A versao vem de $AppVersion em PruPru_Launcher_Standalone.ps1. Depois e so
# revisar o texto do rascunho em Releases e clicar em Publish release.
name: Gerar release do PruPru

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler a versao do codigo
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path Codigo_Fonte/PruPru_Launcher_Standalone.ps1 -Pattern '^\$AppVersion = "([0-9.]+)"' | Select-Object -First 1
          if (-not $line) { throw 'AppVersion nao encontrado' }
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versao: $v"

      - name: Verificar se a release ja existe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release v${{ steps.ver.outputs.version }} ja existe. Aumente o AppVersion antes de gerar outra." }
          exit 0

      - name: Compilar o PruPru.exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          $v = "${{ steps.ver.outputs.version }}"
          Invoke-ps2exe -inputFile Codigo_Fonte\PruPru_Launcher_Standalone.ps1 -outputFile PruPru.exe -noConsole `
            -title "PruPru Digital Services" -product "PruPru Digital Services" -company "PruPru Digital Services" `
            -version "$v.0"
          if (-not (Test-Path PruPru.exe)) { throw 'PruPru.exe nao foi gerado' }
          (Get-FileHash PruPru.exe -Algorithm SHA256).Hash.ToLower() | Tee-Object -FilePath sha256.txt

      - name: Criar a release em rascunho
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $hash = Get-Content sha256.txt
          # O site aponta para releases/latest/download/PruPru.sh e PruPru.command,
          # entao esses dois arquivos precisam estar anexados junto com o .exe.
          Copy-Item Codigo_Fonte\linux\PruPru.sh PruPru.sh
          Copy-Item Codigo_Fonte\macos\PruPru.command PruPru.command
          foreach ($f in 'PruPru.exe', 'PruPru.sh', 'PruPru.command') {
            if (-not (Test-Path $f)) { throw "$f nao encontrado para anexar a release" }
          }
          $text = Get-Content Codigo_Fonte/NOVIDADES.md -Raw -Encoding UTF8
          $pattern = "(?ms)^## v" + [regex]::Escape($v) + "\s*\r?\n(.*?)(?=^## |\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "Codigo_Fonte/NOVIDADES.md nao tem a secao '## v$v'. Escreva as novidades dessa versao antes de gerar a release." }
          $body = $m.Groups[1].Value.Trim()
          $notes = "$body`n`nHash SHA-256 do PruPru.exe: ``$hash``"
          gh release create "v$v" PruPru.exe PruPru.sh PruPru.command --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "PruPru Digital Services v$v" --notes $notes
